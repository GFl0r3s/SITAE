<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SITAE – CONATEL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/base.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
  <script src="js/usuarios.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>
<div class="logincaja"><div class="logincajablanca"><div class="card-body p-4">
  <h1 class="h4 brand text-center mb-0 titulo">SITAE<small class="text-muted">Sistema de Gestión Móvil Aeronáutica · CONATEL</small></h1>
  <form id="loginForm" class="mt-4">
    <label class="form-label" for="lu">Usuario</label>
    <input id="lu" class="form-control mb-3" autocomplete="username" required>
    <label class="form-label" for="lp">Contraseña</label>
    <input id="lp" type="password" class="form-control mb-3" autocomplete="current-password" required>
    <div id="lerr" class="text-danger small mb-2" role="alert" hidden>Usuario o contraseña incorrectos.</div>
    <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
    <p class="text-muted small mt-3 mb-0">Solicita tu cuenta al administrador del sistema.</p>
  </form>
</div></div></div>
</body>
</html>
