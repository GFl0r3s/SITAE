<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SITAE – CONATEL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/base.css" rel="stylesheet">
  <link href="css/lista.css" rel="stylesheet">
  <script src="js/usuarios.js" defer></script>
  <script src="js/datos.js" defer></script>
  <script src="js/gestion-usuarios.js" defer></script>
</head><body hidden>
<nav class="topbar py-2"><div class="container-xl d-flex align-items-center justify-content-between gap-3"><div class="brand">SITAE<small>Sistema de Gestión Móvil Aeronáutica · CONATEL</small></div><div class="d-flex align-items-center gap-3"><a id="btnUsuarios" class="btn btn-sm btn-outline-light" href="usuarios.html" hidden>Usuarios</a><span id="who" class="small"></span><button id="btnOut" class="btn btn-sm btn-outline-light">Cerrar sesión</button></div></div></nav><main class="container-xl py-4">
<div class="d-flex justify-content-between mb-4"><h1 class="h4 titulo">Administración de usuarios</h1><a class="btn btn-outline-secondary" href="lista.html">Volver a licencias</a></div>
<div class="card mb-4"><div class="card-body">
<h2 id="tituloUsuario" class="h5">Registrar usuario</h2>
<form id="usuarioForm" class="row g-3">
<div class="col-md-4"><label for="nombre" class="form-label">Nombre completo</label><input id="nombre" class="form-control" maxlength="150" required></div>
<div class="col-md-4"><label for="usuario" class="form-label">Usuario</label><input id="usuario" class="form-control" minlength="3" maxlength="50" pattern="[A-Za-z0-9_.-]{3,50}" autocomplete="off" required></div>
<div class="col-md-4"><label for="password" class="form-label">Contraseña</label><input id="password" type="password" class="form-control" minlength="10" maxlength="72" autocomplete="new-password" required><small class="text-muted">Al editar, déjala vacía para conservarla.</small></div>
<div class="col-md-4"><label for="rol" class="form-label">Rol</label><select id="rol" class="form-select"><option value="lector">Lector: solo consultar</option><option value="editor">Editor: administrar licencias</option><option value="admin">Administrador: licencias y usuarios</option></select></div>
<div class="col-md-4"><label for="activo" class="form-label">Estado</label><select id="activo" class="form-select"><option value="1">Activo</option><option value="0">Inactivo</option></select></div>
<div class="col-12"><button type="submit" class="btn btn-primary">Guardar usuario</button> <button id="cancelarUsuario" type="button" class="btn btn-outline-secondary">Limpiar / cancelar</button></div>
</form><p id="mensajeUsuario" class="mt-3 mb-0" role="status"></p>
</div></div>
<div class="table-responsive bg-white rounded"><table class="table mb-0 align-middle"><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="usuariosRows"></tbody></table></div>
</main></body>
</html>
